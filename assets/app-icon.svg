<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- MYBENCH application icon (source of the .icns/.ico/.png app icons, see packaging/CMakeLists.txt).
     macOS icon grid: 824x824 body centred on a 1024 canvas, soft shadow below it.
     Motif: the brand glyph of assets/icons/app-icon-color.svg (CH0 sine in green, CH1 square in
     cyan) on an instrument display, with the bench's knob row underneath. -->
<defs>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2A6A"/><stop offset="0.5" stop-color="#17163A"/><stop offset="1" stop-color="#0A0A14"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0D1C"/><stop offset="1" stop-color="#05060C"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2FE8C0" stop-opacity="0.24"/><stop offset="1" stop-color="#2FE8C0" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/><stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="knob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4F7A"/><stop offset="1" stop-color="#1B1C33"/></linearGradient>
</defs>
<!-- shadow (layered, no filters so every SVG renderer draws it the same) -->
<g fill="#000000">
<rect x="96" y="112" width="832" height="832" rx="190" fill-opacity="0.10"/>
<rect x="100" y="110" width="824" height="824" rx="186" fill-opacity="0.14"/>
<rect x="102" y="106" width="820" height="820" rx="184" fill-opacity="0.18"/>
</g>
<!-- body -->
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
<!-- display -->
<rect x="164" y="164" width="696" height="540" rx="72" fill="url(#screen)"/>
<rect x="165" y="165" width="694" height="538" rx="71" fill="none" stroke="#9AA6FF" stroke-opacity="0.18" stroke-width="2"/>
<g fill="none" stroke="#9AA6FF" stroke-width="2" stroke-opacity="0.10"><path d="M280 180v508M396 180v508M628 180v508M744 180v508M180 299h664M180 569h664"/></g>
<path d="M180 434h664M512 180v508" stroke="#9AA6FF" stroke-width="2" stroke-opacity="0.22"/>
<ellipse cx="512" cy="434" rx="330" ry="230" fill="url(#halo)"/>
<!-- traces: the 24-unit brand glyph scaled x44, centred on the display -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="matrix(44 0 0 44 -16 -94)">
<path d="M6 12c1.2-4.5 2.3-4.5 3.25 0s2.05 4.5 3.25 0" stroke="#34F5A0" stroke-width="2.6" stroke-opacity="0.10"/>
<path d="M12.5 12V8.5h2.75v7H18V12" stroke="#2ED8F5" stroke-width="2.6" stroke-opacity="0.10"/>
<path d="M6 12c1.2-4.5 2.3-4.5 3.25 0s2.05 4.5 3.25 0" stroke="#34F5A0" stroke-width="1.6" stroke-opacity="0.22"/>
<path d="M12.5 12V8.5h2.75v7H18V12" stroke="#2ED8F5" stroke-width="1.6" stroke-opacity="0.22"/>
<path d="M6 12c1.2-4.5 2.3-4.5 3.25 0s2.05 4.5 3.25 0" stroke="#34F5A0" stroke-width="0.9"/>
<path d="M12.5 12V8.5h2.75v7H18V12" stroke="#2ED8F5" stroke-width="0.9"/>
<path d="M6 12c1.2-4.5 2.3-4.5 3.25 0s2.05 4.5 3.25 0M12.5 12V8.5h2.75v7H18V12" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.55"/>
</g>
<!-- control row: run LED and three knobs -->
<circle cx="236" cy="812" r="30" fill="#34F5A0" fill-opacity="0.18"/>
<circle cx="236" cy="812" r="17" fill="#34F5A0"/>
<circle cx="230" cy="806" r="6" fill="#FFFFFF" fill-opacity="0.6"/>
<g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2">
<circle cx="452" cy="812" r="46" fill="url(#knob)"/>
<circle cx="604" cy="812" r="46" fill="url(#knob)"/>
<circle cx="756" cy="812" r="46" fill="url(#knob)"/>
</g>
<g stroke-width="10" stroke-linecap="round">
<path d="M452 812l-22-28" stroke="#34F5A0"/>
<path d="M604 812l14-33" stroke="#2ED8F5"/>
<path d="M756 812l30-16" stroke="#C9CCE8"/>
</g>
<!-- glass sheen and edge -->
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
<rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
